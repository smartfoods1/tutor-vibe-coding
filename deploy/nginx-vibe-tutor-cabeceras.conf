# Cabeceras de seguridad de la puerta web. Se incluye en el server y en cada location que define
# sus propios add_header (nginx no hereda add_header cuando el location tiene alguno).
# Va a /etc/nginx/snippets/vibe-tutor-cabeceras.conf. HSTS va sin includeSubDomains: sumalo solo si
# todos los subdominios de tu dominio tienen HTTPS. Si cambiás de antibots, ajustá la CSP.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
