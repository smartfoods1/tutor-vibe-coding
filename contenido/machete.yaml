# --- Planes ---

- id: codex-planes
  tema: planes
  aplica_a: [codex]
  sistema: [mac, windows]
  texto: >-
    Según la página de precios de OpenAI, Codex está incluido en todos los planes de ChatGPT,
    también en el plan sin pago (que OpenAI llama "Free"), pero solo en la app de escritorio y
    sujeto a disponibilidad; los límites de ese plan no están publicados. El plan Go cuesta US$8 por mes (US$6 visto desde Argentina)
    y el Plus, US$20. Todavía no lo probamos: contalo como lo que informa OpenAI, sin prometerlo.
  fuente: https://learn.chatgpt.com/docs/pricing
  verificado: 2026-09-28
  probado: false

- id: claude-planes
  tema: planes
  aplica_a: [claude]
  sistema: [mac, windows]
  texto: >-
    Claude Code no está en el plan sin pago de Claude: hace falta el plan Pro, que cuesta US$20
    por mes (US$17 por mes en el plan anual), más impuestos. No hay un precio especial para
    Argentina.
  fuente: https://claude.com/pricing
  verificado: 2026-09-27
  probado: false

# --- Instalar ---

- id: codex-instalar-mac
  tema: instalar
  aplica_a: [codex]
  sistema: [mac]
  texto: >-
    Bajá la app de escritorio de ChatGPT desde chatgpt.com/download e instalala. Entrá con tu
    cuenta, elegí el modo Codex y abrí la carpeta del kit como proyecto. No hace falta usar la
    terminal.
  fuente: https://chatgpt.com/download
  verificado: 2026-09-28
  probado: false

- id: codex-instalar-windows
  tema: instalar
  aplica_a: [codex]
  sistema: [windows]
  texto: >-
    Instalá la app de ChatGPT desde la Microsoft Store (la nueva, no la que se llama "ChatGPT
    Classic"). Entrá con tu cuenta, elegí el modo Codex y abrí la carpeta del kit como proyecto.
    Funciona en Windows 10 y 11 sin usar la terminal.
  fuente: https://learn.chatgpt.com/docs/windows/windows-app
  verificado: 2026-09-28
  probado: false

