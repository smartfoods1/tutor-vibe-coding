# --- Publicar ---

- id: publicar-netlify-drop
  tema: publicar
  aplica_a: [codex, claude]
  sistema: [mac, windows]
  texto: >-
    Abrí https://app.netlify.com/drop en el navegador y entrá con tu cuenta de Netlify (se puede
    crear con Google). Arrastrá solo la carpeta sitio, nunca la carpeta entera del kit, y esperá
    unos segundos: aparece un link que termina en .netlify.app. En las cuentas creadas desde el
    28/7/2026 el proyecto nace privado: después de esa primera publicación, entrá a Project
    configuration, General, Visitor access, Project visibility, y hacelo público. Recién ahí
    cualquiera puede abrir el link. Para actualizar la página, arrastrá la carpeta de nuevo en la
    sección de deploys del mismo sitio, así el link no cambia.
  fuente: https://docs.netlify.com/manage/security/secure-access-to-sites/project-visibility/
  verificado: 2026-09-28
  probado: false

- id: publicar-claude-artifact
  tema: publicar
  aplica_a: [claude]
  sistema: [mac, windows]
  texto: >-
    Pedile a Claude que publique sitio/index.html como artifact y aprobá la publicación. Abrí el
    link, tocá Share y elegí que lo pueda ver cualquiera con el link. Ojo: las fuentes oficiales se
    contradicen sobre si ese link abre sin cuenta de Claude; hasta probarlo, para compartir usá
    Netlify Drop.
  fuente: https://code.claude.com/docs/en/artifacts
  verificado: 2026-09-28
  probado: false

# --- Límites ---

- id: limites-netlify
  tema: limites
  aplica_a: [codex, claude]
  sistema: [mac, windows]
  texto: >-
    Según Netlify, el plan con el que arranca una cuenta nueva da 300 créditos por mes y cada
    publicación usa 15. Las visitas también gastan créditos. En ese plan no se pueden comprar más
    créditos: si se terminan, Netlify pausa todos los sitios de la cuenta hasta que se renuevan.
    Probá en la computadora y publicá poco.
  fuente: https://docs.netlify.com/manage/accounts-and-billing/billing/billing-for-credit-based-plans/how-credits-work/
  verificado: 2026-09-28
  probado: false

- id: limites-artifact
  tema: limites
  aplica_a: [claude]
  sistema: [mac, windows]
  texto: >-
    Una página publicada desde Claude es un solo archivo HTML de hasta 16 MB, sin servidor. No
    puede cargar imágenes de otros sitios: hay que incluirlas dentro del archivo.
  fuente: https://code.claude.com/docs/en/artifacts
  verificado: 2026-09-28
  probado: false

# --- Volver atrás ---

- id: volver-checkpoints-claude
  tema: volver-atras
  aplica_a: [claude]
  sistema: [mac, windows]
  texto: >-
    Además de guardar-version, Claude guarda un punto de control en cada pedido: con /rewind (o
    Esc dos veces) se puede restaurar el código. No deshace lo que hicieron los comandos y no está
    documentado si funciona en la app de escritorio.
  fuente: https://code.claude.com/docs/en/checkpointing
  verificado: 2026-09-28
  probado: false

