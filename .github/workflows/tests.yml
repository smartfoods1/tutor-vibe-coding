name: tests

# Corre en cada push a main y en cada pull request, también los que llegan desde forks.
# No usa secretos ni llama a servicios pagos: los tests simulan Claude, Gemini, Resend y Turnstile.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (tests de voz)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dependencias
        run: python -m pip install -e ".[dev]"
      - name: Tests del backend y del contenido (sin llamadas pagas)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
